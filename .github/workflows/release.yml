name: Build and release Iris
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: python plugin/test-speech-progress.py
      - run: python scripts/package.py
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const v=require("./release.json").version; if(process.env.GITHUB_REF_NAME!==`v${v}`) process.exit(1)'
      - uses: actions/upload-artifact@v4
        with:
          name: iris-release
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'zbhou2002/iris-zotero'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iris-release
          path: dist
      - name: Publish versioned installer and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Iris $RELEASE_TAG" --generate-notes
